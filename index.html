<title>سنا الإعمار | SANA AL-AMAR</title>
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box;margin:0;padding:24px;text-align:center;background:#f5f8fb;color:#10324d;font-family:Tahoma,Arial,sans-serif}
main{max-width:540px}h1{font-size:25px;margin-bottom:8px}p{line-height:1.8}a{display:inline-block;background:#ee6826;color:#fff;border-radius:10px;padding:13px 25px;text-decoration:none;font-weight:700}

<body>
<main><h1>سنا الإعمار | SANA AL-AMAR</h1><p>تطبيق سنا الإعمار</p><p>سيتم فتح تطبيق سنا الإعمار. وإذا لم تنتقل تلقائياً، اضغط الزر التالي:</p><a href="./app/index.html">فتح تطبيق المستخدم</a></main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const fragment=new URLSearchParams(location.hash.slice(1));
  const recovery=params.get("type")==="recovery" || fragment.get("type")==="recovery" || params.has("token_hash") || fragment.has("error");
  const target=recovery?"./reset-password.html":"./app/index.html";
  window.location.replace(target+location.search+location.hash);
})();
</script>
