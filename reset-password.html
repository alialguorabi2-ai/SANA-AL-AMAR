<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>سنا الإعمار - استعادة كلمة المرور</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#eff5fa;min-height:100vh;display:grid;place-items:center;margin:0;color:#10334d}main{width:min(440px,90vw);padding:26px;background:white;border-radius:16px;box-shadow:0 20px 50px #143e5a18;text-align:center}h2{margin:0 0 8px}.brand{font-size:22px;font-weight:bold;color:#0d3455;margin:0 0 20px}.brand b{color:#ed6a29}p{line-height:1.8;color:#586e82;font-size:13px}label{display:block;text-align:right;font-weight:bold;margin-top:14px}input{box-sizing:border-box;width:100%;padding:13px;margin-top:7px;border:1px solid #cedde9;border-radius:9px;direction:ltr}button{width:100%;padding:13px;margin-top:18px;border:0;border-radius:9px;background:#ef6b26;color:white;font-weight:bold;font-size:14px}#status{color:#ad3a30}#status.ok{color:#16794c}a{display:block;margin-top:22px;color:#126cac}[hidden]{display:none!important}</style>
</head><body><main><div class="brand"><b>♨</b> SANA AL-AMAR</div><h2>تعيين كلمة مرور جديدة</h2><p id="status">جاري التحقق من رابط الاستعادة...</p><form id="reset" hidden><label>كلمة المرور الجديدة<input id="pw" type="password" minlength="12" required autocomplete="new-password"></label><label>تأكيد كلمة المرور<input id="confirm" type="password" minlength="12" required autocomplete="new-password"></label><button type="submit" id="save">حفظ كلمة المرور</button></form><a href="./admin/index.html">العودة إلى تسجيل الدخول</a></main>
<script>
(async function(){
"use strict";
const status=document.getElementById("status"),form=document.getElementById("reset"),btn=document.getElementById("save"),base="https://sseugkalnlclovwhxiys.supabase.co",key="sb_publishable_NPfWrDpXNNlob6YzG0EGJg_KRFDmz0O";
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
let token=hash.get("access_token");const tokenHash=query.get("token_hash"),flow=hash.get("type")||query.get("type");
history.replaceState({},"",location.pathname);
function info(s,ok){status.textContent=s;status.classList.toggle("ok",!!ok)}
async function request(path,method="GET",body){
const res=await fetch(base+path,{method,cache:"no-store",headers:{"apikey":key,"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
const val=await res.json().catch(()=>({}));if(!res.ok)throw Error(val.msg||val.message||val.error_description||"لم تنجح العملية");return val;
}
try{
if(hash.get("error")||query.get("error"))throw Error("رابط الاستعادة منتهي أو غير صالح، اطلب رسالة جديدة.");
if(flow!=="recovery")throw Error("افتح رابط استعادة كلمة المرور الجديد من بريدك الإلكتروني.");
if(!token&&tokenHash){const v=await request("/auth/v1/verify","POST",{token_hash:tokenHash,type:"recovery"});token=v.access_token||v.session?.access_token;}
if(!token)throw Error("رابط الاستعادة ناقص. اطلب رسالة جديدة.");
await request("/auth/v1/user");
form.hidden=false;info("اكتب كلمة مرور جديدة من 12 حرفاً أو أكثر.",true);
}catch(e){info(e.message);}
form.addEventListener("submit",async e=>{e.preventDefault();const p=document.getElementById("pw").value,q=document.getElementById("confirm").value;if(p!==q){info("كلمتا المرور مو متطابقتين.");return}if(p.length<12){info("كلمة المرور لازم تكون 12 حرفاً أو أكثر.");return}
btn.disabled=true;try{await request("/auth/v1/user","PUT",{password:p});form.reset();form.hidden=true;token=null;info("تم تغيير كلمة المرور بنجاح. افتح لوحة الإدارة وسجّل الدخول.",true)}catch(error){info("تعذر تغيير كلمة المرور: "+error.message)}finally{btn.disabled=false}
});
})();
</script></body></html>
